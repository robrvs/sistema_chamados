{% extends 'base.html' %}

{% block aba %}
    {{ titulo }}
{% endblock %}

{% block conteudo %}
<div class="container mt-4 mb-5" style="max-width: 650px;">
    <div class="card shadow">
        <div class="card-header text-white d-flex justify-content-between align-items-center" style="background-color: #008000;">
            <h3 class="card-title h5 mb-0">{{ titulo }}</h3>
            
            {% if chamado %}
                <a href="{% url 'deletar_chamado' chamado.id %}" class="btn btn-danger btn-sm fw-bold">🗑️ Excluir OS</a>
            {% endif %}
        </div>
        <div class="card-body">

            <form method="post" novalidate>
                {% csrf_token %}
                
                {% for field in form %}
                <div class="mb-3">
                    <label class="form-label fw-bold">{{ field.label }}</label>
                    <div class="form-control-container">
                        <script>
                            document.addEventListener("DOMContentLoaded", function() {
                                var el = document.getElementsByName("{{ field.name }}")[0];
                                if (el) el.classList.add("form-control");
                            });
                        </script>
                        {{ field }}
                    </div>
                </div>
                {% endfor %}

                <div class="d-flex justify-content-between mt-4">
                    <a href="{% url 'home' %}" class="btn btn-light border">Voltar ao Painel</a>
                    <button type="submit" class="btn btn-success">Salvar Informações</button>
                </div>
            </form>

        </div>
    </div>
</div>
{% endblock %}
